<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>カメラ概要図メーカー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: drafting-table tool — left tool rail, A3 sheet on a cool slate desk, right property panel, status strip */
:root{
  --desk:#e6eaef; --panel:#ffffff; --panel-2:#f4f6f9; --ink:#17202b; --ink-2:#526070; --line:#d3d9e1;
  --accent:#0a7891; --accent-ink:#ffffff; --accent-soft:#d9eef3; --danger:#c2262d; --shadow:0 1px 2px rgba(20,30,45,.08),0 6px 24px rgba(20,30,45,.10);
  --f-ui:"BIZ UDPGothic","Meiryo","Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-num:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0f141a; --panel:#182029; --panel-2:#1e2731; --ink:#e3e9f0; --ink-2:#9aa8b8; --line:#2c3642;
  --accent:#3bb5d1; --accent-ink:#06222a; --accent-soft:#163541; --danger:#f0646a; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0f141a; --panel:#182029; --panel-2:#1e2731; --ink:#e3e9f0; --ink-2:#9aa8b8; --line:#2c3642;
  --accent:#3bb5d1; --accent-ink:#06222a; --accent-soft:#163541; --danger:#f0646a; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:13px;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;gap:10px;box-sizing:border-box}
button,select,input,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:.02em;margin-right:6px}
.brand svg{width:26px;height:26px}
.grp{display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px}
.grp .lbl{font-size:11px;color:var(--ink-2);padding:0 6px;letter-spacing:.06em}
.btn{border:0;background:transparent;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--panel-2)}
.btn:focus-visible,.tool:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger)}
.btn svg{width:16px;height:16px}
.spacer{flex:1}
.main{display:grid;grid-template-columns:auto 1fr 300px;gap:10px;min-height:0}
.tools{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;overflow-y:auto;width:76px;box-sizing:border-box}
.tools .sep{height:1px;background:var(--line);margin:5px 2px}
.tools .cap{font-size:10px;color:var(--ink-2);text-align:center;letter-spacing:.08em;margin:2px 0}
.tool{border:0;background:transparent;border-radius:7px;padding:6px 2px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;line-height:1.15;color:var(--ink)}
.tool svg{width:24px;height:24px}
.tool:hover{background:var(--panel-2)}
.tool[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
.tool kbd{font-family:var(--f-num);font-size:9px;color:var(--ink-2)}
.stage{position:relative;border-radius:10px;overflow:hidden;background:var(--desk);border:1px solid var(--line);min-width:0;min-height:0}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#cv text{user-select:none}
#cv .locked{pointer-events:none}
body.alt #cv .locked{pointer-events:auto}
.stage.pan #cv{cursor:grab}
.stage.draw #cv{cursor:crosshair}
.zoombox{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;box-shadow:var(--shadow)}
.zoombox .btn{padding:4px 8px}
.zoombox .z{font-family:var(--f-num);font-size:11px;min-width:44px;text-align:center;align-self:center;color:var(--ink-2)}
.hintbar{position:absolute;left:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--ink-2);box-shadow:var(--shadow);max-width:calc(100% - 40px)}
.hintbar b{color:var(--ink)}
.editbar{position:absolute;left:50%;transform:translateX(-50%);top:10px;display:flex;gap:10px;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:6px 6px 6px 14px;box-shadow:var(--shadow);font-size:12.5px;max-width:calc(100% - 140px);flex-wrap:wrap}
.editbar b{font-size:13px}
.editbar .btn{background:var(--panel);color:var(--ink);font-weight:700}
.stage.editing .hintbar,.stage.editing .planbar{display:none}
.pagebar{position:absolute;left:10px;bottom:10px;right:200px;display:flex;gap:6px;align-items:center;pointer-events:none}
.pgscroll{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:0 1 auto;padding:2px 2px 6px;scroll-behavior:smooth}
.pgscroll::-webkit-scrollbar{display:none}
.pagebar .pgsel{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 6px;font-size:12px;box-shadow:var(--shadow);max-width:150px;flex:none}
.pagebar .pg.add,.pagebar .pg.nav{flex:none}
.pagebar>*{pointer-events:auto}
.pagebar .pg{border:1px solid var(--line);background:var(--panel);color:var(--ink-2);border-radius:7px;padding:5px 11px;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);font-size:12px}
.pagebar .pg[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.pagebar .pg.add{font-weight:700;color:var(--accent)}
.stage.editing .pagebar{display:none}
.planbar{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 3px 3px 10px;box-shadow:var(--shadow);font-size:12px;color:var(--ink-2)}
.planbar .btn{padding:4px 9px;background:var(--panel-2)}
.planbar .btn.danger{color:var(--danger)}
.planbar .btn.primary{background:var(--accent);color:var(--accent-ink)}
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:10px 4px;cursor:pointer;font-weight:700;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{overflow-y:auto;padding:12px 14px 18px;display:flex;flex-direction:column;gap:12px;min-height:0;flex:1}
.pane h3{margin:0;font-size:12px;letter-spacing:.08em;color:var(--ink-2);font-weight:700}
.pane h2{margin:0;font-size:15px;text-wrap:balance}
.f{display:grid;gap:4px}
.f>label,.f>.l{font-size:11.5px;color:var(--ink-2)}
.f input[type=text],.f input[type=number],.f input[type=date],.f select,.f textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:6px 8px}
.f textarea{min-height:60px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.f{flex:1;min-width:90px}
.chk{display:flex;gap:6px;align-items:center;cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel-2);padding:6px 4px;cursor:pointer;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:4px;border-top:1px solid var(--line);padding-top:10px}
.actions .btn{background:var(--panel-2);padding:6px 9px}
.note{font-size:11.5px;color:var(--ink-2);line-height:1.6}
.note kbd,.help kbd{font-family:var(--f-num);font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel-2);color:var(--ink)}
.help{margin:0;padding-left:18px;line-height:1.75;font-size:12px}
.help li::marker{color:var(--accent);font-family:var(--f-num)}
.calc{font-family:var(--f-num);font-variant-numeric:tabular-nums;background:var(--panel-2);border-radius:6px;padding:6px 8px;font-size:12px}
table.sum{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.sum th,table.sum td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.sum td.n{text-align:right;font-family:var(--f-num)}
table.sum th{font-size:11px;color:var(--ink-2);font-weight:700}
.sw{display:inline-block;width:26px;height:0;border-top:3px solid #1d4ed8;vertical-align:middle;margin-right:6px}
.imglist{display:grid;gap:6px}
.imglist .it{display:flex;gap:6px;align-items:center;background:var(--panel-2);border-radius:6px;padding:5px 6px}
.imglist .it span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{display:flex;gap:14px;align-items:center;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap}
.status .k{font-family:var(--f-num)}
.status label{display:flex;gap:5px;align-items:center;cursor:pointer}
.modal-bg{position:fixed;inset:0;background:rgba(10,16,24,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:18px;width:min(420px,100%);display:grid;gap:12px;border:1px solid var(--line)}
.modal h2{margin:0;font-size:16px}
.modal .acts{display:flex;justify-content:flex-end;gap:6px}
.modal .acts .btn{background:var(--panel-2)}
.modal .acts .btn.primary{background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:calc(100% - 40px)}
.toast.on{opacity:1}
.busy{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,16,24,.25);z-index:55;font-weight:700}
.busy span{background:var(--panel);padding:12px 18px;border-radius:10px;box-shadow:var(--shadow)}
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:1fr;grid-template-rows:auto 62vh auto}
  .tools{flex-direction:row;width:auto;overflow-x:auto;overflow-y:hidden}
  .tools .sep{width:1px;height:auto;margin:2px 4px}
  .tools .cap{display:none}
  .tool{min-width:58px}
  .side{max-height:none}
  .pane{overflow:visible}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="5" fill="var(--accent)"/><rect x="5" y="9" width="11" height="8" rx="1.6" fill="#fff"/><path d="M16 11l5-2.5v9L16 15z" fill="#fff"/></svg>
      カメラ概要図メーカー
    </div>
    <div class="grp" role="group" aria-label="ファイル">
      <button class="btn" id="bNew">新規</button>
      <button class="btn" id="bOpen" title="保存した作業データ(.json)を開いて続きを編集">開く</button>
      <button class="btn" id="bSave" title="作業データ(.json)を書き出す。全ページ・写真込みで、別のパソコンやブラウザで続きを編集できます">保存(.json)</button>
    </div>
    <div class="grp" role="group" aria-label="元に戻す">
      <button class="btn" id="bUndo" title="元に戻す (Ctrl+Z)"><svg viewBox="0 0 16 16"><path d="M6 3L2 7l4 4M2 7h8a4 4 0 010 8H8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <button class="btn" id="bRedo" title="やり直し (Ctrl+Y)"><svg viewBox="0 0 16 16"><path d="M10 3l4 4-4 4M14 7H6a4 4 0 000 8h2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
    </div>
    <div class="spacer"></div>
    <div class="grp" role="group" aria-label="書き出し">
      <span class="lbl">書き出し</span>
      <select id="selPaper" title="用紙サイズ" style="border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:4px 6px;font-weight:700">
        <option value="A3L">A3横</option><option value="A3P">A3縦</option><option value="A4L">A4横</option><option value="A4P">A4縦</option></select>
      <button class="btn" id="bCopyImg" title="図面を画像としてクリップボードへ（Excelに貼り付け）">画像コピー</button>
      <button class="btn" id="bPng">PNG</button>
      <button class="btn" id="bPdf">PDF</button>
      <button class="btn primary" id="bXlsx">Excel</button>
    </div>
  </header>

  <div class="main">
    <nav class="tools" id="tools" aria-label="ツール"></nav>
    <div class="stage" id="stage">
      <svg id="cv" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="gridp" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dfe6ee" stroke-width="0.8"/></pattern>
          <filter id="pshadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0b1520" flood-opacity=".18"/></filter>
        </defs>
        <g id="paper"></g>
        <g id="objs"></g>
        <g id="fixed"></g>
        <g id="overlay"></g>
      </svg>
      <div class="hintbar" id="hint"></div>
      <div class="planbar" id="planbar" hidden></div>
      <div class="editbar" id="editbar" hidden></div>
      <div class="pagebar" id="pagebar" aria-label="ページ"></div>
      <div class="zoombox">
        <button class="btn" id="zOut" title="縮小">－</button>
        <span class="z" id="zVal">100%</span>
        <button class="btn" id="zIn" title="拡大">＋</button>
        <button class="btn" id="zFit" title="用紙全体を表示">全体</button>
      </div>
    </div>
    <aside class="side">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="props" aria-selected="true">選択中</button>
        <button role="tab" data-tab="meta" aria-selected="false">図面情報</button>
        <button role="tab" data-tab="sum" aria-selected="false">集計</button>
      </div>
      <div class="pane" id="pane"></div>
    </aside>
  </div>

  <footer class="status">
    <span>縮尺 <b class="k" id="sScale">未設定</b></span>
    <label><input type="checkbox" id="cGrid" checked> グリッド</label>
    <label><input type="checkbox" id="cSnap" checked> スナップ</label>
    <span id="sSel"></span>
    <span class="spacer"></span>
    <span id="sSaved"></span>
  </footer>
</div>

<input type="file" id="fImg" accept="image/*" multiple hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ============ constants ============ */
let W = 1680, H = 1188;              // sheet size in units, 4 units = 1 mm
const PAPERS = { A3L: { name: 'A3横', mm: [420, 297] }, A3P: { name: 'A3縦', mm: [297, 420] }, A4L: { name: 'A4横', mm: [297, 210] }, A4P: { name: 'A4縦', mm: [210, 297] } };
const NS = 'http://www.w3.org/2000/svg';
const FONT = '"BIZ UDPGothic","Meiryo","Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif';
const FONT_ATTR = FONT.replace(/"/g, "'");
const BLUE = '#1d4ed8', RED = '#dc2626', CAM = '#38c3e2', CAMD = '#0d5566';
const WIRE = {
  exposed:   { name: '露出配線', color: BLUE, dash: '' },
  concealed: { name: '隠蔽配線', color: BLUE, dash: '12 8' },
  aerial:    { name: '架空配線', color: BLUE, dash: '18 6 3 6' },
  power:     { name: '電源配線', color: RED,  dash: '' },
};
const DEV = {
  recorder: { name: 'レコーダー＋モニター', label: 'レコーダー・モニター', tool: 'レコーダー+モニター' },
  nvr:      { name: 'レコーダーのみ', label: 'レコーダー', tool: 'レコーダー' },
  monitor:  { name: 'モニターのみ', label: 'モニター', tool: 'モニター' },
  panel:    { name: '分電盤', label: '分電盤' },
  box:      { name: '盤BOX', label: '' },
  hub:      { name: 'PoEハブ', label: 'HUB' },
  outlet:   { name: 'コンセント', label: '' },
  pole:     { name: 'ポール', label: 'ポール', tool: 'ポール' },
  vent:     { name: '換気口', label: '' },
  hole:     { name: '貫通・穴あけ', label: '' },
};
const SYM = {
  door1: { name: '片開きドア', tool: '片開き', m: [0.9, 0.9] },
  door2: { name: '両開きドア', tool: '両開き', m: [1.6, 0.8] },
  slide: { name: '引き戸', tool: '引き戸', m: [1.6, 0.25] },
  window: { name: '窓', tool: '窓', m: [1.6, 0.2] },
  stair: { name: '階段', tool: '階段', m: [3.0, 1.2] },
};
function symSize(kind) { const m = SYM[kind].m, f = doc && doc.scale ? doc.scale : 40; let w = m[0] * f, h = m[1] * f; const mn = { door1: 30, door2: 50, slide: 50, window: 50, stair: 90 }[kind]; if (w < mn) { h *= mn / w; w = mn; } if (kind === 'slide' || kind === 'window') h = Math.max(8, Math.min(h, 14)); return [Math.round(w), Math.round(h)]; }
function symIcon(o) {
  const w = o.w, h = o.h, X = -w / 2, Y = -h / 2, cut = o.cut !== false;
  const L = (x1, y1, x2, y2, sw = 1.4) => `<path d="M${r1(x1)},${r1(y1)}L${r1(x2)},${r1(y2)}" stroke="#111" stroke-width="${sw}" fill="none"/>`;
  switch (o.kind) {
    case 'door1': return (cut ? `<path d="M${X},${-Y}H${-X}" stroke="#fff" stroke-width="8"/>` : '') + L(X, -Y, X, Y, 2.2)
      + `<path d="M${-X},${-Y}A${w},${w} 0 0 0 ${X},${Y}" fill="none" stroke="#111" stroke-width="1"/>` + L(X, -Y - 4, X, -Y + 4, 2) + L(-X, -Y - 4, -X, -Y + 4, 2);
    case 'door2': return (cut ? `<path d="M${X},${-Y}H${-X}" stroke="#fff" stroke-width="8"/>` : '') + L(X, -Y, X, Y, 2.2) + L(-X, -Y, -X, Y, 2.2)
      + `<path d="M0,${-Y}A${w / 2},${w / 2} 0 0 0 ${X},${Y}M0,${-Y}A${w / 2},${w / 2} 0 0 1 ${-X},${Y}" fill="none" stroke="#111" stroke-width="1"/>` + L(X, -Y - 4, X, -Y + 4, 2) + L(-X, -Y - 4, -X, -Y + 4, 2);
    case 'slide': { const pw = w * 0.56; return (cut ? `<rect x="${X}" y="${Y - 2}" width="${w}" height="${h + 4}" fill="#fff"/>` : '')
      + `<rect x="${X}" y="${r1(Y)}" width="${r1(pw)}" height="${r1(h / 2)}" fill="#fff" stroke="#111" stroke-width="1.3"/><rect x="${r1(-X - pw)}" y="0" width="${r1(pw)}" height="${r1(h / 2)}" fill="#fff" stroke="#111" stroke-width="1.3"/>`
      + L(X, Y - 3, X, -Y + 3, 2.2) + L(-X, Y - 3, -X, -Y + 3, 2.2); }
    case 'window': return (cut ? `<rect x="${X}" y="${Y - 2}" width="${w}" height="${h + 4}" fill="#fff"/>` : '')

  stage.classList.add('editing'); setTool('select'); select([]);

/* ============ paper ============ */
function applyPaper() {
  const m = PAPERS[doc.paper || 'A3L'].mm; W = m[0] * 4; H = m[1] * 4;
  const sp = document.getElementById('selPaper'); if (sp) sp.value = doc.paper || 'A3L';

    if ('w' in o) { o.w = r1(o.w * f); o.h = r1(o.h * f); }
    if (o.pts) o.pts = o.pts.map(p => m(p[0], p[1]));

    if ('tx' in o) [o.tx, o.ty] = m(o.tx, o.ty);
    if (o.type === 'camera' && o.coneLen) o.coneLen = Math.round(o.coneLen * f);

async function changePaper(key) {
  const sp = $('#selPaper'); sp.value = doc.paper;
  if (!PAPERS[key] || key === doc.paper) return;
  const oldW = W, oldH = H, nm = PAPERS[key].mm, nW = nm[0] * 4, nH = nm[1] * 4;
  const empty = !doc.objects.some(o => o.type !== 'legend');
  let mode = 'fit';
  if (!empty) {
    mode = await modal(`用紙を ${PAPERS[key].name} に変更`, `<p class="note" style="font-size:13px;color:var(--ink)">いま描いてある図をどうしますか？</p>
      <label class="chk"><input type="radio" name="pm" value="fit" checked> 新しい用紙に合わせて図を縮小・拡大する（文字の大きさはそのまま）</label>
      <label class="chk"><input type="radio" name="pm" value="keep"> 位置も大きさも変えない（はみ出した部分は自分で調整）</label>
      <p class="note">縮小・拡大した場合、縮尺も自動で合わせ直します。あとから「元に戻す」で戻せます。</p>`, '変更する', f => f.querySelector('input[name=pm]:checked').value);
    if (!mode) return;
  }
  pushUndo();
  if (mode === 'fit') {
    const f = Math.min((nW - 48) / (oldW - 48), (nH - 48) / (oldH - 48));
    const nx = (nW - (oldW - 48) * f) / 2, ny = (nH - (oldH - 48) * f) / 2;
    forEachPage(() => scaleAll(f, 24, 24, nx, ny));

  doc.paper = key; applyPaper();
  const tb = { x: W - 440, y: H - 40 - 170 };
  syncPage(); for (const lg of doc.pages.flatMap(pg => pg.objects).filter(o => o.type === 'legend')) { const bb = bbox(lg); if (bb.x + bb.w > tb.x - 4 && bb.y + bb.h > tb.y - 4 || bb.x + bb.w > W - 24 || bb.y + bb.h > H - 24) { lg.x = Math.max(30, tb.x - bb.w - 16); lg.y = H - 40 - bb.h; } }
  render(); refreshPane(); save();

/* ============ keyboard ============ */
document.addEventListener('keydown', e => {
  if (document.querySelector('.modal-bg')) return;
  const inField = e.target.matches('input,textarea,select');
  if (e.key === 'Alt') document.body.classList.add('alt');
  if (inField) { if (e.key === 'Escape') e.target.blur(); return; }
  const mod = e.ctrlKey || e.metaKey;
  if (e.code === 'Space') { spaceDown = true; stage.classList.add('pan'); e.preventDefault(); return; }
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicate(); return; }
  if (mod && e.key.toLowerCase() === 'a') { e.preventDefault(); select(doc.objects.filter(o => !o.locked).map(o => o.id)); return; }
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveJson(); return; }
  if (mod) return;
  if (e.key === 'Escape') { if (draft) finishDraft(true); else if (tool !== 'select') setTool('select'); else if (sel.size) select([]); else if (editPhoto) exitPhotoEdit(); return; }
  if (e.key === 'Enter' && draft) { finishDraft(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); delSel(); return; }
  if (e.key.startsWith('Arrow') && sel.size) {
    e.preventDefault(); const st = e.shiftKey ? 10 : 1; const dx = e.key === 'ArrowLeft' ? -st : e.key === 'ArrowRight' ? st : 0, dy = e.key === 'ArrowUp' ? -st : e.key === 'ArrowDown' ? st : 0;
    if (!e.repeat) pushUndo(); for (const id of withKids(sel)) { const o = byId(id); if (o && !o.locked) moveObj(o, clone(o), dx, dy); } render(); save(); return;
  }
  const t = TOOLS.find(t => t.key && t.key.toLowerCase() === e.key.toLowerCase()); if (t) setTool(t.id);
});
document.addEventListener('keyup', e => { if (e.code === 'Space') { spaceDown = false; stage.classList.toggle('pan', tool === 'hand'); } if (e.key === 'Alt') document.body.classList.remove('alt'); });
window.addEventListener('blur', () => { spaceDown = false; document.body.classList.remove('alt'); });

const DPI_SCALE = 200 / 25.4 / 4; // 200dpi

$('#bXlsx').onclick = async () => {

  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js');
  if (mode === 'shapes') await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  const wb = new ExcelJS.Workbook(); wb.creator = 'カメラ概要図メーカー';
  syncPage(); const back = doc.cur, used = new Set(), drawings = [], media = {}, mediaName = {}, sizes = {};
  if (mode === 'shapes') {
    await Promise.all(Object.keys(usedAssets()).map(aid => new Promise(res => { const im = new Image(); im.onload = () => { sizes[aid] = { w: im.naturalWidth, h: im.naturalHeight }; res(); }; im.onerror = res; im.src = blobs[aid] || doc.assets[aid]; })));
  }
  try { for (let pi = 0; pi < doc.pages.length; pi++) {
  usePage(pi);
  let sn = doc.pages.length > 1 ? doc.pages[pi].name.replace(/[\\/?*:\[\]]/g, '').slice(0, 28) || ('図' + (pi + 1)) : '概要図'; if (sn === '数量集計') sn += '図'; let sn2 = sn, k2 = 2; while (used.has(sn2)) sn2 = sn.slice(0, 26) + '_' + k2++; used.add(sn2);
  const ws = wb.addWorksheet(sn2, { pageSetup: { paperSize: doc.paper.startsWith('A3') ? 8 : 9, orientation: PAPERS[doc.paper].mm[0] > PAPERS[doc.paper].mm[1] ? 'landscape' : 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 1, horizontalCentered: true, verticalCentered: true, margins: { left: 0.2, right: 0.2, top: 0.2, bottom: 0.2, header: 0, footer: 0 } }, views: [{ showGridLines: false, zoomScale: 70 }] });
  const extW = mode === 'shapes' ? Math.round(W * 9000 / 9525) : Math.round(PAPERS[doc.paper].mm[0] / 25.4 * 96 * 0.98), extH = mode === 'shapes' ? Math.round(H * 9000 / 9525) : Math.round(extW * H / W);
  const nCol = Math.ceil(extW / 70) + (mode === 'shapes' ? 0 : 1), nRow = Math.ceil(extH / 20) + (mode === 'shapes' ? 0 : 1);
  for (let i = 1; i <= nCol; i++) ws.getColumn(i).width = 10;
  for (let i = 1; i <= nRow; i++) ws.getRow(i).height = 15;
  if (mode === 'shapes') {
    const rels = [], rid = {};
    const ctx = { size: sizes, img: aid => { if (!rid[aid]) { if (!mediaName[aid]) { const d = doc.assets[aid], ext = /^data:image\/png/.test(d) ? 'png' : 'jpeg'; mediaName[aid] = 'camzu_' + Object.keys(mediaName).length + '.' + ext; media[mediaName[aid]] = d.split(',')[1]; } rid[aid] = 'rIdImg' + (rels.length + 1); rels.push({ id: rid[aid], target: mediaName[aid] }); } return rid[aid]; } };
    drawings.push({ sheet: sn2, xml: XL.build(ctx), rels });
  } else {
    const c = await rasterize(DPI_SCALE); const png = c.toDataURL('image/png');
    const img = wb.addImage({ base64: png, extension: 'png' });
    ws.addImage(img, { tl: { col: 0, row: 0 }, ext: { width: extW, height: extH }, editAs: 'oneCell' });
  }
  ws.pageSetup.printArea = 'A1:' + ws.getColumn(nCol).letter + nRow;
  } } finally { usePage(back); }
  const s2 = wb.addWorksheet('数量集計', { pageSetup: { paperSize: 9, orientation: 'portrait' } });
  if (doc.pages.length > 1) {
    const A = summaryAll();
    s2.columns = [{ header: '項目', width: 26 }, ...A.per.map(p => ({ header: p.name, width: 11 })), { header: '合計', width: 10 }, { header: '単位', width: 7 }];
    for (const r of A.rows) s2.addRow([r[0], ...r[1], r[2], r[3]]);
  } else {
    s2.columns = [{ header: '項目', width: 28 }, { header: '数量', width: 10 }, { header: '単位', width: 8 }];
    for (const r of summary().rows) s2.addRow(r);
  }
  s2.getRow(1).font = { bold: true }; s2.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE3EEF3' } };
  s2.addRow([]); s2.addRow(['物件名：' + doc.meta.property]); s2.addRow(['※配線長は概算（約○mの切り上げ合計、余長含まず）']);
  const buf = await wb.xlsx.writeBuffer();
  const blob = mode === 'shapes' ? await XL.inject(buf, drawings, media) : new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  await saveFile(baseName() + (mode === 'shapes' ? '' : '_画像') + '.xlsx', blob);
  });
};
